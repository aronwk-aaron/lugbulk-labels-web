services:
  web:
    # `docker compose pull && docker compose up -d` runs the published image
    # (LUGBULK_TAG: latest = newest release, canary = head of master, or a
    # version like 1.2.0); `docker compose up --build` builds this checkout.
    image: ghcr.io/aronwk-aaron/lugbulk-labels-web:${LUGBULK_TAG:-latest}
    build: .
    ports:
      - "8080:8080"
    volumes:
      - lugbulk-data:/data
    environment:
      # OAuth client credentials — from the Google Cloud Console project's
      # OAuth client (see README for setup). Never commit real values;
      # put them in a local .env file (gitignored) instead.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/auth/callback}
      # 32-byte key (base64), used to encrypt refresh tokens at rest.
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      # Optional: BrickLink API credentials, for part weights (label order)
      # and filling in missing colors. See README "BrickLink".
      - BRICKLINK_CONSUMER_KEY=${BRICKLINK_CONSUMER_KEY:-}
      - BRICKLINK_CONSUMER_SECRET=${BRICKLINK_CONSUMER_SECRET:-}
      - BRICKLINK_TOKEN=${BRICKLINK_TOKEN:-}
      - BRICKLINK_TOKEN_SECRET=${BRICKLINK_TOKEN_SECRET:-}
      # Abuse protection — see .env.example / README.
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-}
      - BRICKLINK_DAILY_CALLS=${BRICKLINK_DAILY_CALLS:-}

volumes:
  lugbulk-data:
