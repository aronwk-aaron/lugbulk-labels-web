name: Build and publish Docker image

# Publishes to GHCR using the repo's built-in GITHUB_TOKEN — no registry
# secrets to create or rotate. Runs on every push to master (tagged
# `latest` + the commit SHA) and on version tags `v*` (tagged with the
# version, e.g. v1.2.0 -> 1.2.0, 1.2, 1, latest). Pull requests only build,
# never push, so a PR from a fork can't publish an image under this repo's
# name. Every run also boots the built image and checks it serves before
# anything is pushed.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Build once into the local daemon (unit tests run inside the build),
      # then boot it and check it actually serves before publishing anything.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lugbulk-labels-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e GOOGLE_OAUTH_CLIENT_ID=ci -e GOOGLE_OAUTH_CLIENT_SECRET=ci \
            -e TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            lugbulk-labels-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          # Logged-out dashboard must redirect to Google login.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 302
          # Runs as the unprivileged user, not root.
          docker top smoke -o pid,user,args
          # (the host has no name for the container's uid 10001, so ps may show either)
          if docker top smoke -o pid,user | tail -n +2 | awk '{print $2}' | grep -vxE 'lugbulk|10001'; then
            echo "container has processes running as another user" >&2
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
