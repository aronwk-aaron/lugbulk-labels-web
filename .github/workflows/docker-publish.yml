name: Build, publish and release

# One pipeline for every build of the image:
#   - pull request:        build + test + smoke test only, nothing published
#   - push to master:      canary — image tags `canary` and the short SHA, and
#                          the rolling "canary" GitHub pre-release moved to
#                          the new head of master
#   - push of a `v*` tag:  release — image tags X.Y.Z, X.Y, X and `latest`,
#                          and a GitHub release with generated notes
#                          (pre-release if the tag has a suffix, e.g. v1.2.0-rc.1)
# Publishes to GHCR with the repo's built-in GITHUB_TOKEN — no secrets to
# manage. Every build boots the image and checks it serves before anything
# is pushed.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

# Canary builds queue rather than race, so the `canary` tag and release
# always end up on the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Jobs get only the permissions they ask for.
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            refs/heads/master) version="canary-${GITHUB_SHA::7}" ;;
            *) version="pr-${GITHUB_SHA::7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` follows releases only; `canary` is always the head of master.
          flavor: latest=false
          tags: |
            type=raw,value=canary,enable={{is_default_branch}}
            type=sha,prefix=,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # Build once into the local daemon (unit tests run inside the build),
      # then boot it and check it actually serves before publishing anything.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lugbulk-labels-web:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The browser code (static/js/) must match the C++ it ports: the build
      # above ran tests/golden.cpp on the fixtures; export what it wrote (all
      # cache hits) and check the JavaScript gives the same results. (What
      # the retired C++ PDF/CSV/label code made is checked in instead:
      # tests/js/golden/, read by the same tests.)
      - name: Export golden files
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: golden
          outputs: type=local,dest=golden
          cache-from: type=gha

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Browser code tests (parity with the C++)
        env:
          GOLDEN_DIR: golden
        run: |
          ls golden
          node --test tests/js/*.test.mjs

      # How much the image weighs, and what master's last published canary
      # weighed (if it can be pulled), for reviewing changes that add or drop
      # dependencies.
      - name: Image size
        run: |
          size() { docker image inspect "$1" --format '{{.Size}}'; }
          now="$(size lugbulk-labels-web:ci)"
          echo "this build: $now bytes"
          {
            echo "### Image size"
            echo "- this build: $((now / 1024 / 1024)) MiB ($now bytes)"
          } >> "$GITHUB_STEP_SUMMARY"
          if docker pull -q "$REGISTRY/$IMAGE_NAME:canary" > /dev/null 2>&1; then
            before="$(size "$REGISTRY/$IMAGE_NAME:canary")"
            echo "canary (master): $before bytes"
            echo "- canary (master): $((before / 1024 / 1024)) MiB ($before bytes)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "canary image not available to pull; no comparison"
          fi

      - name: Smoke test the container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e GOOGLE_OAUTH_CLIENT_ID=ci -e GOOGLE_OAUTH_CLIENT_SECRET=ci \
            -e TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            lugbulk-labels-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          # Reports the version it was built as.
          test "$(curl -fsS http://localhost:8080/version)" = "$VERSION"
          # An oversized request body is dropped, not buffered (Crow patch).
          code="$(head -c 200000 /dev/zero | curl -s -o /dev/null -w '%{http_code}' -H 'Expect:' \
            -X POST --data-binary @- http://localhost:8080/sheets || true)"
          test "$code" = 000
          # The dashboard is open to anyone (uploads); sign-in is offered.
          # (captured first: grep -q exiting early would fail the pipe under pipefail)
          page="$(curl -fsS http://localhost:8080/)"
          grep -q 'Sign in with Google' <<< "$page"
          # The server no longer reads uploads or makes PDFs/zips (the
          # browser does): every route that did is gone.
          for gone in /upload/check /upload/labels /upload/checklist /upload/parts /upload/lots \
                      /upload/all /upload/preview /sheets/1/labels /sheets/1/checklist \
                      /sheets/1/parts /sheets/1/lots /sheets/1/all /sheets/1/preview; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              --data-binary @tests/fixtures/sample_order.xlsx \
              -H 'Content-Type: application/octet-stream' "http://localhost:8080$gone")"
            echo "POST $gone -> $code"
            test "$code" = 404
          done
          for gone in /preview /test-page /sheets/1/check /sheets/1/labels /sheets/1/preview; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$gone")"
            echo "GET $gone -> $code"
            test "$code" = 404
          done
          # Privacy policy and terms (linked from Google's consent screen).
          curl -fsS http://localhost:8080/privacy | grep -q 'Limited Use'
          curl -fsS http://localhost:8080/terms | grep -q 'Terms of service'
          # Endpoints the browser-side renderer uses. BrickLink lookup: JSON (the CI
          # image has no BrickLink data, so {} is fine); a bad body is a 400.
          lookup="$(curl -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"ids":["6225242","4211388"]}' http://localhost:8080/bricklink/lookup)"
          echo "lookup -> $lookup"
          python3 -c 'import json,sys; assert isinstance(json.loads(sys.argv[1]), dict)' "$lookup"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{"ids":["../x"]}' \
            http://localhost:8080/bricklink/lookup)"
          test "$code" = 400
          # Part photos: only <digits>.jpg; served from the cache (seeded
          # here, so CI never needs lego.com) with a long public Cache-Control.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/img/abc.jpg)"
          echo "/img/abc.jpg -> $code"
          test "$code" = 404 || test "$code" = 400
          docker exec smoke sh -c "printf '\377\330\377\340ci' > /data/image_cache/1234567.jpg && : > /data/image_cache/7654321.jpg"
          curl -fsS -D img.headers -o img.jpg http://localhost:8080/img/1234567.jpg
          cat img.headers
          grep -qi '^content-type: image/jpeg' img.headers
          grep -qi '^cache-control: public, max-age=604800, immutable' img.headers
          test "$(head -c 3 img.jpg | od -An -tx1 | tr -d ' \n')" = ffd8ff
          # A cached miss (LEGO has no photo) is a 404.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/img/7654321.jpg)"
          test "$code" = 404
          # Label stock list: public JSON, cacheable for an hour.
          curl -fsS -D specs.headers -o specs.json http://localhost:8080/label-specs.json
          grep -qi '^cache-control: public, max-age=3600' specs.headers
          python3 -c 'import json; d=json.load(open("specs.json")); assert d["default"]=="avery5162" and len(d["specs"])>40 and all("label_width_mm" in s for s in d["specs"])'
          # Browser modules: JavaScript, cacheable for 5 minutes, flat
          # [a-z0-9_-]+.js names only.
          curl -fsS -D js.headers -o pivot.js http://localhost:8080/static/js/pivot.js
          cat js.headers
          grep -qi '^content-type: text/javascript' js.headers
          grep -qi '^cache-control: public, max-age=300' js.headers
          grep -q 'export function pivotSheet' pivot.js
          # The sheet reader and loader the dashboard imports.
          curl -fsS -o spreadsheet.js http://localhost:8080/static/js/spreadsheet.js
          grep -q 'export async function readXlsx' spreadsheet.js
          curl -fsS -o load.js http://localhost:8080/static/js/load.js
          grep -q 'export async function loadSheet' load.js
          # The reports, their options, the zip writer and the font widths the
          # dashboard uses, and the vendored pdf-lib they import (served
          # unmodified).
          for f in reports.js report_options.js printf.js zip.js afm.js vendor/pdf-lib.js; do
            curl -fsS -D mod.headers -o mod.js "http://localhost:8080/static/js/$f"
            echo "/static/js/$f -> $(wc -c < mod.js) bytes"
            grep -qi '^content-type: text/javascript' mod.headers
            grep -qi '^cache-control: public, max-age=300' mod.headers
          done
          curl -fsS -o reports.js http://localhost:8080/static/js/reports.js
          grep -q 'export async function checklistPdf' reports.js
          grep -qF "from './vendor/pdf-lib.js'" reports.js
          curl -fsS -o zip.js http://localhost:8080/static/js/zip.js
          grep -q 'export function zip' zip.js
          curl -fsS -o afm.js http://localhost:8080/static/js/afm.js
          grep -q 'export function helveticaMeasure' afm.js
          grep -qF "from './afm.js'" reports.js
          curl -fsS -o pdf-lib.js http://localhost:8080/static/js/vendor/pdf-lib.js
          sha256sum pdf-lib.js
          test "$(sha256sum < pdf-lib.js | cut -d' ' -f1)" = 72c052d97b4d5d9fa6cdbdcb7ad709f03d4ddb1122390cb3afeba4d88651d969
          # Label PDFs in the browser: labels.js, the image backdrop, the
          # labels worker and the vendored QR generator (pinned build).
          for f in labels.js backdrop.js labels_worker.js vendor/qrcodegen.js; do
            curl -fsS -D mod.headers -o mod.js "http://localhost:8080/static/js/$f"
            echo "/static/js/$f -> $(wc -c < mod.js) bytes"
            grep -qi '^content-type: text/javascript' mod.headers
            grep -qi '^cache-control: public, max-age=300' mod.headers
            # A worker runs under its own script's CSP: this app's scripts only.
            grep -qi "^content-security-policy: default-src 'none'; script-src 'self'" mod.headers
          done
          curl -fsS -o labels.js http://localhost:8080/static/js/labels.js
          grep -q 'export async function buildLabelsPdf' labels.js
          grep -qF "from './vendor/qrcodegen.js'" labels.js
          curl -fsS -o qrcodegen.js http://localhost:8080/static/js/vendor/qrcodegen.js
          test "$(sha256sum < qrcodegen.js | cut -d' ' -f1)" = 0cc3d38d2c3b2f083bec80e61d27270ea11328ecc9130b0c4cb829aa70f6d8d4
          # Logging a browser-made download needs sign-in.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data '{"report_type":"labels","item_count":3}' http://localhost:8080/sheets/1/runs)"
          echo "POST /sheets/1/runs signed out -> $code"
          test "$code" = 401 || test "$code" = 403
          # The vendor folder has the same flat-name rule: its README and
          # license aren't served, and nothing outside it can be reached.
          for bad in README.md pdf-lib.LICENSE.md Pdf-lib.js ..%2Freports.js ..%2F..%2F..%2Fsql%2Fschema.sql; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/static/js/vendor/$bad")"
            echo "/static/js/vendor/$bad -> $code"
            test "$code" = 404 || test "$code" = 400
          done
          # Saving a sheet's design (and its report options) needs sign-in.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' \
            --data '{"spec":"avery5162","order":"heaviest","hide":"qr","report_options":{}}' \
            http://localhost:8080/sheets/1/design)"
          echo "PUT /sheets/1/design signed out -> $code"
          test "$code" = 401
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/sheets/1/design)"
          test "$code" = 401
          # The dashboard's script is a module that loads sheets with them.
          grep -q '<script type="module" nonce="' <<< "$page"
          grep -qF "import { loadSheet } from '/static/js/load.js';" <<< "$page"
          grep -qF "import * as reports from '/static/js/reports.js';" <<< "$page"
          grep -q 'id="dl-zip"' <<< "$page"
          for bad in nope.js Pivot.js package.json ..%2Fpivot.js ..%2F..%2Fsql%2Fschema.sql; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/static/js/$bad")"
            echo "/static/js/$bad -> $code"
            test "$code" = 404 || test "$code" = 400
          done
          # The dashboard's CSP lets same-origin modules load beside its nonce.
          curl -fsS -D dash.headers -o /dev/null http://localhost:8080/
          grep -qi "^content-security-policy: default-src 'self'; script-src 'self' 'nonce-" dash.headers
          # ...and a same-origin Web Worker (the labels worker).
          grep -qi "worker-src 'self'" dash.headers
          # The dashboard makes the labels itself: it never sends a file or
          # asks the server for a labels PDF or preview any more.
          for gone in "/upload/" "/preview?" "'/labels?'" "/all" "X-File-Name"; do
            if grep -qF "$gone" <<< "$page"; then echo "dashboard still uses $gone"; exit 1; fi
          done
          grep -qF "new Worker('/static/js/labels_worker.js', { type: 'module' })" <<< "$page"
          # Everything else stays uncacheable.
          curl -fsS -D version.headers -o /dev/null http://localhost:8080/version
          grep -qi '^cache-control: no-store, private' version.headers
          # Raw sheet values need sign-in.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/sheets/1/values)"
          test "$code" = 401
          # There is no bigger body limit for a file any more (files are read
          # in the browser): 11 MB to a route that exists is dropped too.
          # (Expect: off, or curl reports the server's "100 Continue" as the status)
          code="$(head -c 11000000 /dev/zero | curl -s -o /dev/null -w '%{http_code}' -H 'Expect:' \
            -X POST --data-binary @- http://localhost:8080/bricklink/lookup || true)"
          echo "oversized body -> $code"
          test "$code" = 000
          # Runs as the unprivileged user, not root.
          docker top smoke -o pid,user,args
          # (the host has no name for the container's uid 10001, so ps may show either)
          if docker top smoke -o pid,user | tail -n +2 | awk '{print $2}' | grep -vxE 'lugbulk|10001'; then
            echo "container has processes running as another user" >&2
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

  github-release:
    needs: build-and-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build-and-publish.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release notes header
        run: |
          # GitHub renames dot-files on upload ("default.env.example").
          cp .env.example env.example
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$VERSION"; else tag=canary; fi
          cat > header.md <<EOF
          ## Container image

          \`\`\`
          docker pull $IMAGE:$tag
          \`\`\`

          Deploy with the attached \`docker-compose.yml\` and \`env.example\` (save it as \`.env\`)
          (see the README's OAuth setup). The dashboard header and \`/version\`
          show \`$VERSION\`.
          EOF

      - name: Release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease \
            --title "$GITHUB_REF_NAME" --notes-file header.md \
            docker-compose.yml env.example

      - name: Canary (head of master)
        if: github.ref == 'refs/heads/master'
        run: |
          last_release="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          {
            echo "Rolling pre-release: always the head of \`master\` ($GITHUB_SHA)."
            echo "Not a stable release — use the latest \`v*\` release for that."
            echo
            cat header.md
            echo
            echo "## Changes since ${last_release:-the first commit}"
            echo
            git log --pretty='- %s (%h)' ${last_release:+$last_release..}HEAD | head -50
          } > notes.md
          gh release delete canary --yes --cleanup-tag 2>/dev/null || true
          gh release create canary --target "$GITHUB_SHA" --prerelease \
            --title "Canary ($VERSION)" --notes-file notes.md \
            docker-compose.yml env.example
