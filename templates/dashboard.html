<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lugbulk-labels-web</title>
<script>
  // Apply the saved theme before first paint (no flash of the wrong one).
  try {
    const t = localStorage.getItem('lugbulk.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9; --surface: #ffffff; --fg: #1d2329; --muted: #667080;
    --border: #d9dde3; --border-strong: #b9c0c9;
    --button-bg: #ffffff; --button-hover: #eef1f5;
    --accent: #1f6feb; --accent-hover: #1a5fcc; --accent-fg: #ffffff;
    --error: #b42318; --ok: #1a7f37; --focus: #1f6feb66;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1216; --surface: #171b21; --fg: #e6e9ee; --muted: #98a1ae;
    --border: #2b323c; --border-strong: #3c4550;
    --button-bg: #20262e; --button-hover: #29313b;
    --accent: #4b8ff5; --accent-hover: #6aa3f7; --accent-fg: #0b0f14;
    --error: #f97066; --ok: #4ac26b; --focus: #4b8ff566;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1216; --surface: #171b21; --fg: #e6e9ee; --muted: #98a1ae;
      --border: #2b323c; --border-strong: #3c4550;
      --button-bg: #20262e; --button-hover: #29313b;
      --accent: #4b8ff5; --accent-hover: #6aa3f7; --accent-fg: #0b0f14;
      --error: #f97066; --ok: #4ac26b; --focus: #4b8ff566;
    }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg);
         color: var(--fg); max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem;
         line-height: 1.4; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
           flex-wrap: wrap; margin-bottom: 1.5rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  h1 .version { font-size: 0.75rem; color: var(--muted); font-weight: normal; margin-left: 0.3rem; }
  .who { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  #whoami { color: var(--muted); font-size: 0.9rem; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  section[hidden] { display: none; }
  h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }
  .muted, .note { color: var(--muted); font-size: 0.85rem; }
  .note { margin: 0 0 0.75rem; }
  .error { color: var(--error); }
  .ok { color: var(--ok); }
  button, select, input { font: inherit; color: var(--fg); }
  button { background: var(--button-bg); border: 1px solid var(--border-strong); border-radius: 6px;
           padding: 0.35rem 0.8rem; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--button-hover); }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.danger { color: var(--error); }
  select, input[type=text], input[type=search] {
    background: var(--button-bg); border: 1px solid var(--border-strong); border-radius: 6px;
    padding: 0.35rem 0.5rem; min-width: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  form#logout { display: inline; margin: 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  a { color: var(--accent); }

  /* Saved sheets: one card-like row each. */
  .sheet { padding: 0.8rem 0; border-top: 1px solid var(--border); }
  .sheet:first-child { border-top: 0; padding-top: 0.25rem; }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem;
                flex-wrap: wrap; margin-bottom: 0.5rem; }
  .sheet-name { font-weight: 600; overflow-wrap: anywhere; }
  .status { font-size: 0.85rem; margin: 0 0 0.5rem; }
  .status:empty { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .actions .spacer { flex: 1; }
  .issues { font-size: 0.85rem; margin: 0.5rem 0 0; padding-left: 1.2rem; list-style: disc; }
  .issues:empty { display: none; }
  .empty { color: var(--muted); font-style: italic; }

  /* Search results. */
  .search-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  .search-row input { flex: 1; }
  .result { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
            padding: 0.5rem 0; border-top: 1px solid var(--border); }
  .result:first-child { border-top: 0; }
  .result .file { min-width: 0; overflow-wrap: anywhere; }

  /* Controls rows. */
  .options { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem;
             margin-bottom: 0.75rem; font-size: 0.9rem; }
  .field { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.85rem; color: var(--muted); }
  .field > * { color: var(--fg); }
  .field.grow { flex: 1 1 320px; min-width: 0; }
  .field.grow select { width: 100%; }
  .inline-field { display: flex; align-items: center; gap: 0.4rem; }

  /* Design panel. */
  .switches { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
              gap: 0.35rem 1rem; margin: 0.25rem 0 0.9rem; font-size: 0.9rem; }
  .switches label { display: flex; gap: 0.45rem; align-items: center; cursor: pointer; }
  .switches input { width: 1rem; height: 1rem; accent-color: var(--accent); }
  .design-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
                 flex-wrap: wrap; }
  #preview { width: 100%; height: 560px; border: 1px solid var(--border); border-radius: 6px;
             background: #fff; display: block; }
</style>
</head>
<body>
<header>
  <h1>lugbulk-labels-web<span class="version" title="build version">{{version}}</span></h1>
  <div class="who">
    <span id="whoami">{{email}}</span>
    <button type="button" id="theme-btn" title="Color theme">Theme: Auto</button>
    <form id="logout" method="post" action="/auth/logout">
      <button type="submit">Log out</button>
    </form>
  </div>
</header>

<section>
  <h2>Your saved sheets</h2>
  <div class="options">
    <label class="inline-field">Parts list &amp; lot counts as
      <select id="report-format">
        <option value="pdf">PDF</option>
        <option value="csv">CSV</option>
      </select>
    </label>
  </div>
  <ul id="saved-list"><li class="empty">Loading&hellip;</li></ul>
</section>

<section id="design" hidden>
  <div class="design-head">
    <h2>Label design — <span id="design-sheet"></span></h2>
    <button type="button" id="design-close">Close</button>
  </div>
  <p class="note">Saved with the sheet: everyone who has this sheet saved prints this design.
    The preview uses sample parts. <span id="design-status"></span></p>
  <div class="options">
    <label class="field grow">Label stock
      <select id="label-spec">
        {{#spec_groups}}<optgroup label="{{label}}">{{#specs}}<option value="{{id}}"{{#selected}} selected{{/selected}}>{{name}}</option>{{/specs}}</optgroup>{{/spec_groups}}
      </select>
    </label>
    <label class="field">Find stock
      <input type="search" id="label-filter" placeholder="8162, 30857, shipping…" size="18">
    </label>
    <label class="field">Part order
      <select id="part-order">
        <option value="heaviest">Heaviest parts first</option>
        <option value="lightest">Lightest parts first</option>
        <option value="sheet">Sheet order</option>
      </select>
    </label>
    <button type="button" id="test-page-btn">Alignment test page</button>
  </div>
  <div class="switches" id="switches"></div>
  <iframe id="preview" title="Label preview"></iframe>
  <p class="note" style="margin-top:0.5rem">Preview blank (some phones can't show PDFs inline)?
    <a id="preview-open" href="#" target="_blank" rel="noopener">Open it in a new tab</a>.</p>
</section>

<section>
  <h2>Find a sheet</h2>
  <div class="search-row">
    <input type="text" id="search-box" placeholder="Search your Google Sheets by name&hellip;">
    <button id="search-btn" type="button">Search</button>
  </div>
  <ul id="search-results"></ul>
</section>

<script>
function el(tag, props, children) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  if (children) for (const c of children) e.appendChild(c);
  return e;
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials: 'same-origin' }, opts || {}));
  if (res.status === 401) {
    window.location.href = '/auth/login';
    throw new Error('not logged in');
  }
  return res;
}

// Remembers the option pickers across visits (per browser only).
for (const id of ['report-format']) {
  const select = document.getElementById(id);
  try {
    const saved = localStorage.getItem('lugbulk.' + id);
    if (saved && [...select.options].some(o => o.value === saved)) select.value = saved;
  } catch (e) { /* storage unavailable: defaults are fine */ }
  select.addEventListener('change', () => {
    try { localStorage.setItem('lugbulk.' + id, select.value); } catch (e) {}
  });
}
const opt = (id) => document.getElementById(id).value;

// Color theme: Auto (follow the system) → Light → Dark, remembered per browser.
(() => {
  const btn = document.getElementById('theme-btn');
  const order = ['auto', 'light', 'dark'];
  const label = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  let theme = document.documentElement.dataset.theme || 'auto';
  const apply = () => {
    if (theme === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    btn.textContent = 'Theme: ' + label[theme];
  };
  apply();
  btn.addEventListener('click', () => {
    theme = order[(order.indexOf(theme) + 1) % order.length];
    try { localStorage.setItem('lugbulk.theme', theme); } catch (e) {}
    apply();
  });
})();

// Narrow the (long) label stock list to options matching the search box:
// part number, any equivalent, size, or description.
document.getElementById('label-filter').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const select = document.getElementById('label-spec');
  let firstMatch = null;
  for (const group of select.querySelectorAll('optgroup')) {
    let any = false;
    for (const o of group.querySelectorAll('option')) {
      const hit = !q || o.textContent.toLowerCase().includes(q);
      o.hidden = !hit;
      if (hit) { any = true; firstMatch = firstMatch || o; }
    }
    group.hidden = !any;
  }
  if (q && firstMatch && select.selectedOptions[0].hidden) {
    select.value = firstMatch.value;
    select.dispatchEvent(new Event('change'));
  }
});

// --- Label design panel -------------------------------------------------
// Switches for each label part; names match the server's LabelPart names.
const PARTS = [
  ['photo', 'Part photo'], ['element_id', 'Element ID'], ['qty', 'Quantity'],
  ['lego_color', 'LEGO color'], ['bl_color', 'BrickLink color'], ['description', 'Description'],
  ['name', 'Name'], ['count', '"3 of 10" count'], ['backdrop', 'Gray tile behind clear/white parts'],
  ['swatch', 'Color swatch'], ['qr', 'QR code to BrickLink'],
];
const switchesEl = document.getElementById('switches');
for (const [id, text] of PARTS) {
  const box = el('input', { type: 'checkbox', id: 'part-' + id });
  switchesEl.appendChild(el('label', {}, [box, document.createTextNode(text)]));
}
let designSheet = null;  // the saved sheet whose design is open
let previewUrl = null;
const debounce = (fn, ms) => { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; };

function currentDesign() {
  const hide = PARTS.filter(([id]) => !document.getElementById('part-' + id).checked).map(([id]) => id);
  return { spec: opt('label-spec'), order: opt('part-order'), hide: hide.join(',') };
}

const refreshPreview = debounce(async () => {
  const d = currentDesign();
  const q = new URLSearchParams(d).toString();
  try {
    const res = await api('/preview?' + q);
    if (!res.ok) throw new Error(await res.text());
    const url = URL.createObjectURL(await res.blob());
    document.getElementById('preview').src = url + '#view=FitH';
    document.getElementById('preview-open').href = url;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = url;
  } catch (e) {
    document.getElementById('design-status').textContent = e.message;
  }
}, 350);

const saveDesign = debounce(async () => {
  if (!designSheet) return;
  const status = document.getElementById('design-status');
  try {
    const res = await api('/sheets/' + encodeURIComponent(designSheet.row_id) + '/design', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentDesign())
    });
    if (!res.ok) throw new Error(await res.text());
    status.textContent = 'Saved.';
  } catch (e) {
    status.textContent = 'Not saved: ' + e.message;
  }
}, 700);

function designChanged() {
  document.getElementById('design-status').textContent = 'Saving…';
  refreshPreview();
  saveDesign();
}
for (const id of ['label-spec', 'part-order']) {
  document.getElementById(id).addEventListener('change', designChanged);
}
switchesEl.addEventListener('change', designChanged);

async function openDesign(sheet) {
  const res = await api('/sheets/' + encodeURIComponent(sheet.row_id) + '/design');
  if (!res.ok) return;
  const d = await res.json();
  designSheet = sheet;
  document.getElementById('design-sheet').textContent = sheet.display_name;
  document.getElementById('label-spec').value = d.spec;
  document.getElementById('part-order').value = d.order;
  const hidden = new Set(d.hide.split(',').filter(Boolean));
  for (const [id] of PARTS) document.getElementById('part-' + id).checked = !hidden.has(id);
  document.getElementById('design-status').textContent = '';
  const panel = document.getElementById('design');
  panel.hidden = false;
  panel.scrollIntoView({ behavior: 'smooth' });
  refreshPreview();
}
document.getElementById('design-close').addEventListener('click', () => {
  document.getElementById('design').hidden = true;
  designSheet = null;
});
document.getElementById('test-page-btn').addEventListener('click', async () => {
  try {
    const res = await api('/test-page?spec=' + encodeURIComponent(opt('label-spec')));
    if (!res.ok) throw new Error(await res.text());
    window.open(URL.createObjectURL(await res.blob()), '_blank');
  } catch (e) {
    document.getElementById('design-status').textContent = e.message;
  }
});

// Triggers a browser download from a POST response — fetch() can't drive
// navigation directly, so the response body is read as a blob and handed
// to a throwaway <a download> click, then the object URL is revoked.
async function downloadFrom(path, filenameFallback) {
  const res = await api(path, { method: 'POST' });
  if (!res.ok) {
    // Server errors are short plain-text messages meant for the user.
    const text = await res.text().catch(() => '');
    throw new Error(text || ('Request failed (' + res.status + ') — try again.'));
  }
  const blob = await res.blob();
  const disposition = res.headers.get('Content-Disposition') || '';
  const match = disposition.match(/filename="([^"]+)"/);
  const filename = match ? match[1] : filenameFallback;

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function loadSavedSheets() {
  const list = document.getElementById('saved-list');
  list.textContent = '';
  try {
    const res = await api('/sheets');
    const data = await res.json();
    if (!data.sheets.length) {
      list.appendChild(el('li', { class: 'empty result', text: 'No sheets saved yet — search below to add one.' }));
      return;
    }
    for (const sheet of data.sheets) {
      const nameSpan = el('span', { class: 'sheet-name', text: sheet.display_name });

      const statusSpan = el('p', { class: 'status muted' });

      const base = '/sheets/' + encodeURIComponent(sheet.row_id);
      const issuesList = el('ul', { class: 'issues' });
      const historySpan = el('span', { class: 'muted history' });

      // "Last run" line, from the server's run log.
      const REPORT_NAMES = { labels: 'Labels', lot_counts: 'Lot counts', parts: 'Parts list', checklist: 'Checklist' };
      const refreshHistory = async () => {
        try {
          const res = await api(base + '/history');
          if (!res.ok) return;
          const run = (await res.json()).runs[0];
          historySpan.textContent = run
            ? 'Last run: ' + (REPORT_NAMES[run.report_type] || run.report_type) + ', ' +
              new Date(run.generated_at.replace(' ', 'T') + 'Z').toLocaleString() +
              (run.status === 'ok' ? ' (' + run.item_count + ')' : ' — failed')
            : '';
        } catch (e) { /* history is a nicety; ignore */ }
      };
      refreshHistory();

      // One button per download; the query string carries the pickers.
      const downloadButton = (label, busyText, pathFn, fallbackFn) => {
        const btn = el('button', { type: 'button', text: label });
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          statusSpan.classList.remove('error'); statusSpan.classList.add('muted');
          statusSpan.textContent = busyText;
          try {
            await downloadFrom(pathFn(), fallbackFn());
            statusSpan.textContent = '';
          } catch (e) {
            statusSpan.classList.add('error'); statusSpan.classList.remove('muted');
            statusSpan.textContent = e.message;
          }
          btn.disabled = false;
          refreshHistory();
        });
        return btn;
      };

      const checkBtn = el('button', { type: 'button', text: 'Check sheet' });
      checkBtn.addEventListener('click', async () => {
        checkBtn.disabled = true;
        statusSpan.classList.remove('error'); statusSpan.classList.add('muted');
        statusSpan.textContent = 'Checking…';
        issuesList.textContent = '';
        try {
          const res = await api(base + '/check');
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          statusSpan.textContent = data.labels + ' labels, ' +
            (data.issues.length ? data.issues.length + ' issue(s):' : 'no issues found.');
          for (const issue of data.issues) {
            issuesList.appendChild(el('li', { text: 'Row ' + issue.row + ': ' + issue.detail }));
          }
        } catch (e) {
          statusSpan.classList.add('error'); statusSpan.classList.remove('muted');
          statusSpan.textContent = e.message || 'Check failed — try again.';
        }
        checkBtn.disabled = false;
      });

      const designBtn = el('button', { type: 'button', text: 'Design' });
      designBtn.addEventListener('click', () => openDesign(sheet));
      // Labels, checklist and parts list follow the sheet's saved design.
      const labelsBtn = downloadButton('Labels', 'Generating labels… (can take a minute)',
        () => base + '/labels', () => sheet.display_name + ' labels.pdf');
      const checklistBtn = downloadButton('Checklist', 'Generating packing checklist…',
        () => base + '/checklist', () => sheet.display_name + ' packing checklist.pdf');
      const partsBtn = downloadButton('Parts list', 'Generating parts list…',
        () => base + '/parts?format=' + encodeURIComponent(opt('report-format')),
        () => sheet.display_name + ' parts.' + opt('report-format'));
      const lotsBtn = downloadButton('Lot counts', 'Generating lot counts…',
        () => base + '/lots?format=' + encodeURIComponent(opt('report-format')),
        () => sheet.display_name + ' lot counts.' + opt('report-format'));

      const delBtn = el('button', { type: 'button', text: 'Remove' });
      delBtn.addEventListener('click', async () => {
        delBtn.disabled = true;
        try {
          if (!confirm('Remove "' + sheet.display_name + '" from your list? (The Google Sheet itself is not touched.)')) {
            delBtn.disabled = false;
            return;
          }
          await api(base, { method: 'DELETE' });
          loadSavedSheets();
        } catch (e) {
          delBtn.disabled = false;
        }
      });

      labelsBtn.classList.add('primary');
      delBtn.classList.add('danger');
      const actions = el('div', { class: 'actions' },
        [labelsBtn, designBtn, checklistBtn, partsBtn, lotsBtn, checkBtn, el('span', { class: 'spacer' }), delBtn]);
      list.appendChild(el('li', { class: 'sheet' }, [
        el('div', { class: 'sheet-head' }, [nameSpan, historySpan]),
        statusSpan,
        actions,
        issuesList
      ]));
    }
  } catch (e) {
    list.appendChild(el('li', { class: 'error result', text: 'Could not load saved sheets.' }));
  }
}

async function runSearch() {
  const q = document.getElementById('search-box').value.trim();
  const results = document.getElementById('search-results');
  results.textContent = '';
  results.appendChild(el('li', { class: 'empty result', text: 'Searching…' }));
  try {
    const res = await api('/sheets/search?q=' + encodeURIComponent(q));
    const data = await res.json();
    results.textContent = '';
    if (!data.files.length) {
      results.appendChild(el('li', { class: 'empty result', text: 'No matching spreadsheets found.' }));
      return;
    }
    for (const file of data.files) {
      const nameSpan = el('span', { class: 'sheet-name', text: file.name });
      const metaSpan = el('span', { class: 'muted', text: file.modifiedTime ? '  ·  edited ' + file.modifiedTime.slice(0, 10) : '' });
      const addBtn = el('button', { type: 'button', text: 'Add' });
      addBtn.addEventListener('click', async () => {
        addBtn.disabled = true;
        addBtn.textContent = 'Adding…';
        try {
          await api('/sheets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sheet_id: file.id, display_name: file.name.slice(0, 200) })
          });
          addBtn.textContent = 'Added';
          loadSavedSheets();
        } catch (e) {
          addBtn.disabled = false;
          addBtn.textContent = 'Add';
        }
      });
      results.appendChild(el('li', { class: 'result' }, [el('span', { class: 'file' }, [nameSpan, metaSpan]), addBtn]));
    }
  } catch (e) {
    results.textContent = '';
    results.appendChild(el('li', { class: 'error result', text: 'Search failed — try again.' }));
  }
}

document.getElementById('search-btn').addEventListener('click', runSearch);
document.getElementById('search-box').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); runSearch(); }
});

loadSavedSheets();
</script>
</body>
</html>
