<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lugbulk-labels-web</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; }
  h1 { font-size: 1.25rem; margin: 0; }
  #whoami { color: #666; font-size: 0.9rem; }
  section { margin-bottom: 2rem; }
  h2 { font-size: 1rem; margin-bottom: 0.5rem; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  input[type=text] { flex: 1; padding: 0.4rem 0.6rem; }
  button { padding: 0.4rem 0.8rem; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
       padding: 0.6rem 0; border-bottom: 1px solid #ddd; gap: 0.5rem; }
  li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
             max-width: 220px; display: inline-block; }
  li .meta { color: #888; font-size: 0.8rem; }
  li .actions { display: flex; gap: 0.4rem; flex-shrink: 0; align-items: center; }
  .empty { color: #888; font-style: italic; }
  .error, li .meta.error { color: #b00020; }
  form#logout { display: inline; }
  select { padding: 0.3rem; }
  .options { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.75rem; font-size: 0.9rem; }
  .options label { display: flex; gap: 0.3rem; align-items: center; }
  li .actions { flex-wrap: wrap; }
  li .issues { flex-basis: 100%; font-size: 0.85rem; margin: 0.25rem 0 0; padding-left: 1.2rem;
               list-style: disc; }
  li .issues li { display: list-item; border: 0; padding: 0.1rem 0; }
</style>
</head>
<body>
<header>
  <h1>lugbulk-labels-web</h1>
  <span>
    <span id="whoami">{{email}}</span>
    <form id="logout" method="post" action="/auth/logout">
      <button type="submit">Log out</button>
    </form>
  </span>
</header>

<section>
  <h2>Your saved sheets</h2>
  <div class="options">
    <label>Label size
      <select id="label-spec">
        {{#specs}}<option value="{{id}}">{{name}}</option>{{/specs}}
      </select>
    </label>
    <label>Part order
      <select id="part-order">
        <option value="heaviest">Heaviest parts first</option>
        <option value="lightest">Lightest parts first</option>
        <option value="sheet">Sheet order</option>
      </select>
    </label>
    <label>Reports as
      <select id="report-format">
        <option value="pdf">PDF</option>
        <option value="csv">CSV</option>
      </select>
    </label>
  </div>
  <ul id="saved-list"><li class="empty">Loading&hellip;</li></ul>
</section>

<section>
  <h2>Find a sheet</h2>
  <div class="row">
    <input type="text" id="search-box" placeholder="Search your Google Sheets by name&hellip;">
    <button id="search-btn" type="button">Search</button>
  </div>
  <ul id="search-results"></ul>
</section>

<script>
function el(tag, props, children) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  if (children) for (const c of children) e.appendChild(c);
  return e;
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials: 'same-origin' }, opts || {}));
  if (res.status === 401) {
    window.location.href = '/auth/login';
    throw new Error('not logged in');
  }
  return res;
}

// Remembers the option pickers across visits (per browser only).
for (const id of ['label-spec', 'part-order', 'report-format']) {
  const select = document.getElementById(id);
  try {
    const saved = localStorage.getItem('lugbulk.' + id);
    if (saved && [...select.options].some(o => o.value === saved)) select.value = saved;
  } catch (e) { /* storage unavailable: defaults are fine */ }
  select.addEventListener('change', () => {
    try { localStorage.setItem('lugbulk.' + id, select.value); } catch (e) {}
  });
}
const opt = (id) => document.getElementById(id).value;

// Triggers a browser download from a POST response — fetch() can't drive
// navigation directly, so the response body is read as a blob and handed
// to a throwaway <a download> click, then the object URL is revoked.
async function downloadFrom(path, filenameFallback) {
  const res = await api(path, { method: 'POST' });
  if (!res.ok) {
    // Server errors are short plain-text messages meant for the user.
    const text = await res.text().catch(() => '');
    throw new Error(text || ('Request failed (' + res.status + ') — try again.'));
  }
  const blob = await res.blob();
  const disposition = res.headers.get('Content-Disposition') || '';
  const match = disposition.match(/filename="([^"]+)"/);
  const filename = match ? match[1] : filenameFallback;

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function loadSavedSheets() {
  const list = document.getElementById('saved-list');
  list.textContent = '';
  try {
    const res = await api('/sheets');
    const data = await res.json();
    if (!data.sheets.length) {
      list.appendChild(el('li', { class: 'empty', text: 'No sheets saved yet — search below to add one.' }));
      return;
    }
    for (const sheet of data.sheets) {
      const nameSpan = el('span', { class: 'name', text: sheet.display_name });

      const statusSpan = el('span', { class: 'meta' });

      const base = '/sheets/' + encodeURIComponent(sheet.row_id);
      const issuesList = el('ul', { class: 'issues' });
      const historySpan = el('span', { class: 'meta history' });

      // "Last run" line, from the server's run log.
      const REPORT_NAMES = { labels: 'Labels', lot_counts: 'Lot counts', parts: 'Parts list' };
      const refreshHistory = async () => {
        try {
          const res = await api(base + '/history');
          if (!res.ok) return;
          const run = (await res.json()).runs[0];
          historySpan.textContent = run
            ? 'Last run: ' + (REPORT_NAMES[run.report_type] || run.report_type) + ', ' +
              new Date(run.generated_at.replace(' ', 'T') + 'Z').toLocaleString() +
              (run.status === 'ok' ? ' (' + run.item_count + ')' : ' — failed')
            : '';
        } catch (e) { /* history is a nicety; ignore */ }
      };
      refreshHistory();

      // One button per download; the query string carries the pickers.
      const downloadButton = (label, busyText, pathFn, fallbackFn) => {
        const btn = el('button', { type: 'button', text: label });
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          statusSpan.classList.remove('error');
          statusSpan.textContent = busyText;
          try {
            await downloadFrom(pathFn(), fallbackFn());
            statusSpan.textContent = '';
          } catch (e) {
            statusSpan.classList.add('error');
            statusSpan.textContent = e.message;
          }
          btn.disabled = false;
          refreshHistory();
        });
        return btn;
      };

      const checkBtn = el('button', { type: 'button', text: 'Check sheet' });
      checkBtn.addEventListener('click', async () => {
        checkBtn.disabled = true;
        statusSpan.classList.remove('error');
        statusSpan.textContent = 'Checking…';
        issuesList.textContent = '';
        try {
          const res = await api(base + '/check');
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          statusSpan.textContent = data.labels + ' labels, ' +
            (data.issues.length ? data.issues.length + ' issue(s):' : 'no issues found.');
          for (const issue of data.issues) {
            issuesList.appendChild(el('li', { text: 'Row ' + issue.row + ': ' + issue.detail }));
          }
        } catch (e) {
          statusSpan.classList.add('error');
          statusSpan.textContent = e.message || 'Check failed — try again.';
        }
        checkBtn.disabled = false;
      });

      const labelsBtn = downloadButton('Labels', 'Generating labels… (can take a minute)',
        () => base + '/labels?spec=' + encodeURIComponent(opt('label-spec')) +
              '&order=' + encodeURIComponent(opt('part-order')),
        () => sheet.display_name + ' labels.pdf');
      const partsBtn = downloadButton('Parts list', 'Generating parts list…',
        () => base + '/parts?format=' + encodeURIComponent(opt('report-format')) +
              '&order=' + encodeURIComponent(opt('part-order')),
        () => sheet.display_name + ' parts.' + opt('report-format'));
      const lotsBtn = downloadButton('Lot counts', 'Generating lot counts…',
        () => base + '/lots?format=' + encodeURIComponent(opt('report-format')),
        () => sheet.display_name + ' lot counts.' + opt('report-format'));

      const delBtn = el('button', { type: 'button', text: 'Remove' });
      delBtn.addEventListener('click', async () => {
        delBtn.disabled = true;
        try {
          if (!confirm('Remove "' + sheet.display_name + '" from your list? (The Google Sheet itself is not touched.)')) {
            delBtn.disabled = false;
            return;
          }
          await api(base, { method: 'DELETE' });
          loadSavedSheets();
        } catch (e) {
          delBtn.disabled = false;
        }
      });

      const actions = el('span', { class: 'actions' }, [checkBtn, labelsBtn, partsBtn, lotsBtn, delBtn]);
      list.appendChild(el('li', {}, [
        el('span', {}, [nameSpan, document.createElement('br'), statusSpan,
                        document.createElement('br'), historySpan]),
        actions,
        issuesList
      ]));
    }
  } catch (e) {
    list.appendChild(el('li', { class: 'error', text: 'Could not load saved sheets.' }));
  }
}

async function runSearch() {
  const q = document.getElementById('search-box').value.trim();
  const results = document.getElementById('search-results');
  results.textContent = '';
  results.appendChild(el('li', { class: 'empty', text: 'Searching…' }));
  try {
    const res = await api('/sheets/search?q=' + encodeURIComponent(q));
    const data = await res.json();
    results.textContent = '';
    if (!data.files.length) {
      results.appendChild(el('li', { class: 'empty', text: 'No matching spreadsheets found.' }));
      return;
    }
    for (const file of data.files) {
      const nameSpan = el('span', { class: 'name', text: file.name });
      const metaSpan = el('span', { class: 'meta', text: file.modifiedTime ? file.modifiedTime.slice(0, 10) : '' });
      const addBtn = el('button', { type: 'button', text: 'Add' });
      addBtn.addEventListener('click', async () => {
        addBtn.disabled = true;
        addBtn.textContent = 'Adding…';
        try {
          await api('/sheets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sheet_id: file.id, display_name: file.name.slice(0, 200) })
          });
          addBtn.textContent = 'Added';
          loadSavedSheets();
        } catch (e) {
          addBtn.disabled = false;
          addBtn.textContent = 'Add';
        }
      });
      results.appendChild(el('li', {}, [el('span', {}, [nameSpan, document.createTextNode(' '), metaSpan]), addBtn]));
    }
  } catch (e) {
    results.textContent = '';
    results.appendChild(el('li', { class: 'error', text: 'Search failed — try again.' }));
  }
}

document.getElementById('search-btn').addEventListener('click', runSearch);
document.getElementById('search-box').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); runSearch(); }
});

loadSavedSheets();
</script>
</body>
</html>
